<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pearl Harbor - Graving Dock</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--font-sans:'Oswald','Arial Narrow',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace}

.ph{position:relative;min-height:648px;border-radius:12px;overflow:hidden;border:1px solid #3E4A44;font-family:var(--font-sans);color:#EDE6D6}
.ph svg.bgm{position:absolute;inset:0;width:100%;height:100%}
.pnl{background:rgba(22,26,22,.9);border:1px solid #514B3E;border-radius:10px}
.eng{font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;color:#9A917E}
.win{background:rgba(12,14,12,.72);border:1px solid #4A453A;border-radius:5px;padding:6px 9px}
.ph button{font-family:inherit;color:#EDE6D6;background:rgba(51,47,39,.9);border:1px solid #4A453A;border-radius:5px;cursor:pointer;transition:background .14s,border-color .14s,color .14s,transform .07s}
.ph button:hover{background:#413B31;border-color:#7E7663}
.ph button:active{transform:translateY(1px) scale(.99)}
.cl{padding:4px 8px;font-size:12px;background:transparent!important;color:#9A917E!important}
.cl[aria-pressed="true"]{color:#EDE6D6!important;border-color:#CFC3A8!important;background:rgba(51,47,39,.9)!important}
.sg{flex:1;height:10px;border-radius:1px;background:#2C2F2A;transition:background .18s ease-out}
.pip{width:9px;height:9px;border-radius:2px;background:#2C2F2A;border:0.5px solid #4A453A;transition:background .25s,border-color .25s}
.pip.on{background:#CFC3A8;border-color:#CFC3A8}
.hull{transform-box:view-box;transform-origin:510px 390px;transition:transform .7s cubic-bezier(.22,1,.36,1)}
.fade{animation:fd .3s ease-out both}@keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
.cr1{animation:cr 16s ease-in-out infinite}.cr2{animation:cr 21s ease-in-out infinite reverse}
@keyframes cr{0%,100%{transform:translateY(0)}50%{transform:translateY(200px)}}
.lmp{animation:bl 2.6s ease-in-out infinite}@keyframes bl{0%,100%{opacity:1}50%{opacity:.22}}}

  
  
  
  #screenPort .ph > div[style*="padding:12px"]{ flex:1 1 auto !important; min-height:0 !important; overflow:visible !important; }
  .ph{ min-height:0 !important; height:auto !important; }
  @media (max-height:700px){
    .ph{ min-height:0 !important; }
    
  }
  @media (max-width:900px){
    .ph .pnl[style*="width:314px"]{ width:100% !important; max-width:100% !important; }
  }
  /* fit-screen: harbour fits without cutting, whole port visible */
  #screenPort{ display:flex !important; flex-direction:column !important; height:calc(100vh - 32px) !important; max-height:calc(100vh - 32px) !important; overflow:hidden !important; }
  #screenPort .ph{ flex:1 1 auto !important; min-height:0 !important; height:100% !important; max-height:100% !important; overflow:hidden !important; display:flex !important; flex-direction:column !important; }
  #screenPort .ph svg.bgm{ position:absolute !important; inset:0 !important; width:100% !important; height:100% !important; object-fit:contain !important; object-position:center bottom !important; }
  #screenPort .ph > div[style*="padding:12px"]{ flex:1 1 auto !important; min-height:0 !important; overflow:auto !important; position:relative !important; z-index:1 !important; }
  .ph{ min-height:0 !important; height:100% !important; }
</style></head><body style="padding:14px;background:#0a1216">
<div class="ph">
<svg class="bgm" viewBox="0 0 680 648" preserveAspectRatio="xMidYMid meet" role="img"><title>Pearl Harbor, plan view</title><desc>Stylised overhead map of the harbour: lochs, Ford Island, the mooring quays of Battleship Row, and the navy yard graving docks.</desc>

<g fill="#5D5A46"><rect x="392" y="228" width="10" height="26" rx="2"/><rect x="440" y="230" width="10" height="26" rx="2"/><rect x="488" y="230" width="10" height="26" rx="2"/><rect x="536" y="228" width="10" height="26" rx="2"/></g>
<g fill="#2F332C" stroke="#7E7663" stroke-width="0.8"><rect x="360" y="246" width="26" height="9" rx="4"/><rect x="408" y="250" width="26" height="9" rx="4"/><rect x="456" y="250" width="26" height="9" rx="4"/><rect x="504" y="248" width="26" height="9" rx="4"/><rect x="552" y="246" width="26" height="9" rx="4"/></g>

<text x="486" y="176" text-anchor="middle" fill="#D8D2B4" font-size="11" font-family="ui-monospace,monospace" letter-spacing="2" opacity=".8">ford island</text>
<text x="358" y="288" fill="#BFD8DC" font-size="11" font-family="ui-monospace,monospace" letter-spacing="1.5" opacity=".75">battleship row</text>

</svg>

<div style="position:relative;padding:12px">
  <div class="pnl" style="display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:10px">
    &#9875;
    <span style="font-size:14px">Graving dock no. 4</span>
    <span class="win eng" style="margin-left:auto">steel <b id="m1" style="color:#EDE6D6;font-weight:500">0</b></span>
    <span class="win eng">hours <b id="m2" style="color:#EDE6D6;font-weight:500">0</b></span>
  </div>

  <div class="pnl" style="width:314px;padding:10px 12px">
    <div id="rail" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px"></div>
    <div style="display:flex;align-items:center;gap:7px">
      <button aria-label="Previous hull" onclick="step(-1)" style="width:26px;height:26px;border-radius:50%;border-color:#7E7663;display:flex;align-items:center;justify-content:center;padding:0">&#9664;</button>
      <div id="head" class="win" style="flex:1;min-width:0;padding:4px 9px">
        <div id="nm" style="font-size:15px;font-weight:500">&#8212;</div>
        <div id="rl" class="eng">&#8212;</div>
      </div>
      <button aria-label="Next hull" onclick="step(1)" style="width:26px;height:26px;border-radius:50%;border-color:#7E7663;display:flex;align-items:center;justify-content:center;padding:0">&#9654;</button>
    </div>
    <div class="eng" style="margin:11px 0 5px">ratings</div>
    <div id="ladders"></div>
    <div class="eng" style="margin:11px 0 4px">refit slots</div>
    <div id="upg"></div>
    <div id="specs" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:10px"></div>
    <div style="display:flex;align-items:center;gap:8px;margin:11px 0 5px"><span class="eng">refit progress</span><span class="eng" id="rfv" style="margin-left:auto;color:#EDE6D6">0%</span></div>
    <div style="position:relative;height:13px;border:1px solid #4A453A;border-radius:7px;background:rgba(12,14,12,.72);padding:2px">
      <i id="rfb" style="display:block;height:7px;width:0;background:#CFC3A8;border-radius:4px;transition:width .8s cubic-bezier(.22,1,.36,1)"></i>
      <i id="rfn" style="position:absolute;top:-3px;left:0;width:2px;height:17px;background:#EDE6D6;transition:left .8s cubic-bezier(.34,1.4,.55,1)"></i>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px">
      <button style="flex:1;height:32px;font-size:12px;border-color:#8FA85E;color:#CFE0B0">Engage yard</button>
      <button style="flex:1;height:32px;font-size:12px">Flood dock</button>
      <button id="ask" style="height:32px;font-size:12px;padding:0 10px">Report &#8599;</button>
    </div>
  </div>

  <div style="position:absolute;top:66px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
    <div class="pnl eng" style="padding:5px 9px;display:flex;align-items:center;gap:6px"><span class="lmp" style="width:6px;height:6px;border-radius:50%;background:#8FA85E;display:inline-block"></span><span id="berth">berth 01</span></div>
    <div class="pnl eng" style="padding:5px 9px">dock <b id="dl" style="color:#EDE6D6;font-weight:500">&#8212;</b></div>
    <div class="pnl eng" style="padding:5px 9px">clearance <b id="dc" style="color:#EDE6D6;font-weight:500">&#8212;</b></div>
  </div>
</div>
</div>

<script>
const D=[
{n:"Destroyer",L:140,B:20,dl:"118 m",dc:"3.2 m",s:[
 {n:"Fletcher",v:"united states navy",st:[26,52,74,88,56],sp:["2,100 t","36.5 kn","5 &#215; 5 in","329"],r:41},
 {n:"Fubuki",v:"imperial japanese navy",st:[22,64,38,92,62],sp:["1,750 t","38 kn","6 &#215; 12.7 cm","219"],r:18},
 {n:"Type 1936A",v:"kriegsmarine",st:[28,60,44,84,40],sp:["2,600 t","36 kn","5 &#215; 15 cm","332"],r:73}]},
{n:"Light cruiser",L:166,B:26,dl:"187 m",dc:"4.6 m",s:[
 {n:"Belfast",v:"royal navy",st:[46,62,58,72,66],sp:["11,550 t","32.5 kn","12 &#215; 6 in","781"],r:64},
 {n:"Cleveland",v:"united states navy",st:[48,64,82,72,60],sp:["11,750 t","32.5 kn","12 &#215; 6 in","1,255"],r:29},
 {n:"Agano",v:"imperial japanese navy",st:[34,54,40,80,58],sp:["6,650 t","35 kn","6 &#215; 15 cm","730"],r:88}]},
{n:"Heavy cruiser",L:176,B:30,dl:"203 m",dc:"5.1 m",s:[
 {n:"Baltimore",v:"united states navy",st:[58,74,86,68,64],sp:["14,500 t","33 kn","9 &#215; 8 in","1,142"],r:12},
 {n:"Admiral Hipper",v:"kriegsmarine",st:[60,76,62,70,44],sp:["16,170 t","32 kn","8 &#215; 20.3 cm","1,600"],r:55},
 {n:"Takao",v:"imperial japanese navy",st:[56,80,48,74,60],sp:["15,490 t","34.2 kn","10 &#215; 20.3 cm","773"],r:37}]},
{n:"Battleship",L:196,B:38,dl:"271 m",dc:"6.8 m",s:[
 {n:"Iowa",v:"united states navy",st:[88,94,92,66,72],sp:["57,540 t","33 kn","9 &#215; 16 in","2,788"],r:22},
 {n:"Bismarck",v:"kriegsmarine",st:[86,88,64,58,50],sp:["50,300 t","30 kn","8 &#215; 38 cm","2,065"],r:69},
 {n:"Yamato",v:"imperial japanese navy",st:[96,100,70,48,54],sp:["72,800 t","27 kn","9 &#215; 46 cm","2,767"],r:45}]},
{n:"Fleet carrier",L:204,B:42,dl:"288 m",dc:"7.4 m",s:[
 {n:"Essex",v:"united states navy",st:[42,30,88,66,96],sp:["36,380 t","33 kn","90 aircraft","2,600"],r:31},
 {n:"Akagi",v:"imperial japanese navy",st:[38,34,42,62,84],sp:["41,300 t","31 kn","66 aircraft","1,630"],r:76},
 {n:"Illustrious",v:"royal navy",st:[64,26,70,58,62],sp:["28,600 t","30.5 kn","36 aircraft","1,229"],r:58}]},
{n:"Submarine",L:110,B:14,dl:"96 m",dc:"2.4 m",s:[
 {n:"Gato",v:"united states navy",st:[14,68,10,34,44],sp:["2,410 t","20.3 kn","10 tubes","60"],r:47},
 {n:"Type VIIC",v:"kriegsmarine",st:[12,58,8,30,28],sp:["871 t","17.7 kn","5 tubes","44"],r:81},
 {n:"I-400",v:"imperial japanese navy",st:[20,62,14,32,70],sp:["6,670 t","18.7 kn","8 tubes","144"],r:9}]}];
const LB=["armour","firepower","anti-air","speed","detection"],CO=["#6E9BB0","#C87F4A","#C8A94A","#7FB093","#9A86B0"],SK=["displacement","speed","battery","complement"],SEG=11;
const UP=[{n:"Armour belt",i:"ti-shield",k:0,c:420},{n:"Gunnery director",i:"ti-crosshair",k:1,c:310},{n:"Anti-air battery",i:"ti-antenna",k:2,c:260},{n:"Boiler refit",i:"ti-flame",k:3,c:380}];
let ci=0,si=0,steel=0,lv={};
const rail=document.getElementById('rail');
D.forEach((c,i)=>{const b=document.createElement('button');b.className='cl';b.textContent=c.n;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{ci=i;si=0;draw()};rail.appendChild(b)});
document.getElementById('ladders').innerHTML=LB.map((l,i)=>
 '<div style="display:flex;align-items:center;gap:8px;margin:'+(i?'7px':'0')+' 0 0">'
 +'<span class="eng" style="width:64px">'+l+'</span>'
 +'<span style="flex:1;display:flex;gap:2px">'+Array.from({length:SEG},(_,j)=>'<i class="sg" data-r="'+i+'" data-j="'+j+'" style="transition-delay:'+j*24+'ms"></i>').join('')+'</span>'
 +'<span class="eng" id="lv'+i+'" style="width:20px;text-align:right;color:#EDE6D6">0</span></div>').join('');
function key(){return ci+'-'+si}
function lvls(){const k=key();if(!lv[k]){const s=D[ci].s[si];lv[k]=UP.map(u=>Math.min(3,Math.floor(s.st[u.k]/28)))}return lv[k]}
function count(el,to,dur,fmt){const f=parseFloat(el.dataset.v||0),t0=performance.now();(function t(n){const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3),v=Math.round(f+(to-f)*e);el.textContent=fmt?v.toLocaleString():v;if(p<1)requestAnimationFrame(t);else el.dataset.v=to})(t0)}
function fit(i){const a=lvls();if(a[i]>=3||steel<UP[i].c)return;a[i]++;steel-=UP[i].c;count(document.getElementById('m1'),steel,500,1);upg()}
function upg(){const a=lvls();
 document.getElementById('upg').innerHTML=UP.map((u,i)=>
  '<div style="display:flex;align-items:center;gap:7px;padding:5px 0'+(i?';border-top:1px solid #333A33':'')+'">'
  +'<i class="ti '+u.i+'" style="font-size:15px;color:'+(a[i]?'#CFC3A8':'#6E6759')+'" aria-hidden="true"></i>'
  +'<span style="font-size:12px;flex:1">'+u.n+'</span>'
  +'<span style="display:flex;gap:3px">'+[0,1,2].map(p=>'<i class="pip'+(p<a[i]?' on':'')+'" style="transition-delay:'+p*70+'ms"></i>').join('')+'</span>'
  +'<button onclick="fit('+i+')" style="font-size:11px;padding:3px 7px;font-family:var(--font-mono)'+(a[i]>=3?';color:#8FA85E;border-color:#4A5B3A':'')+'">'+(a[i]>=3?'fitted':u.c+' t')+'</button></div>').join('');
}
function step(d){const n=D[ci].s.length;si=(si+d+n)%n;draw()}
function draw(){
 const c=D[ci],s=c.s[si];
 rail.querySelectorAll('.cl').forEach((b,i)=>b.setAttribute('aria-pressed',i===ci));
 document.getElementById('berth').textContent='berth '+String(ci*3+si+1).padStart(2,'0');
 document.getElementById('nm').textContent=s.n+' class';
 document.getElementById('rl').textContent=c.n+' &#183; '+s.v;
 document.getElementById('dl').textContent=c.dl;
 document.getElementById('dc').textContent=c.dc;
 const h=document.getElementById('head');h.classList.remove('fade');void h.offsetWidth;h.classList.add('fade');
 document.getElementById('specs').innerHTML=SK.map((k,i)=>
  '<div class="win"><div class="eng" style="margin-bottom:2px">'+k+'</div><div style="font-size:12px">'+s.sp[i]+'</div></div>').join('');
 document.querySelectorAll('#ladders .sg').forEach(el=>{
  const r=+el.dataset.r,lit=Math.round(s.st[r]/100*SEG);el.style.background=(+el.dataset.j<lit)?CO[r]:'#2C2F2A'});
 s.st.forEach((v,i)=>count(document.getElementById('lv'+i),Math.round(v),750));
 const sy=c.L/110,sx=c.B/22,ty=(222-c.L)/2;
 document.getElementById('hull').style.transform='translate(0,'+ty.toFixed(1)+'px) scale('+sx.toFixed(3)+','+sy.toFixed(3)+')';
 requestAnimationFrame(()=>{document.getElementById('rfb').style.width=s.r+'%';document.getElementById('rfn').style.left='calc('+s.r+'% - 1px)'});
 document.getElementById('rfv').textContent=s.r+'%';
 steel=4200+ci*1900+si*260;
 count(document.getElementById('m1'),steel,700,1);
 count(document.getElementById('m2'),180+ci*95+si*30,700,1);
 upg();
 document.getElementById('ask').onclick=()=>sendPrompt('Write a 1943 drydock yard report for a '+s.n+' class ship of the '+s.v+'.');
}
draw();
</script>
</body></html>
