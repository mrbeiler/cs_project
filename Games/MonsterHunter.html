<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaloria: The Lost Realm</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #263b4d, #0c1218 70%);
    color: #f2f5f8;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

#game {
    width: min(1150px, 96%);
    margin: 18px auto;
}

.shell {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.header {
    background: #18222c;
    border: 1px solid #3b4a58;
    border-radius: 15px;
    padding: 14px 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;
}

.location {
    margin-top: 4px;
    color: #9cabb8;
    font-size: 14px;
}

.stats {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.stat {
    background: #222e39;
    border: 1px solid #3a4855;
    border-radius: 9px;
    padding: 8px 11px;
    font-size: 13px;
}

.resources {
    background: #111920;
    border: 1px solid #303e4a;
    border-radius: 11px;
    padding: 9px 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    color: #b8c4ce;
    font-size: 13px;
}

.resources b {
    color: #f1f5f7;
}

.screen {
    background: #18222c;
    border: 1px solid #3b4a58;
    border-radius: 15px;
    padding: 20px;
    min-height: 600px;
}

h1,
h2,
h3 {
    margin-top: 0;
}

p {
    line-height: 1.55;
}

.muted {
    color: #9eabb7;
}

.description {
    color: #bdc8d1;
    line-height: 1.6;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 17px;
}

button {
    min-height: 44px;
    padding: 10px 14px;
    color: white;
    background: #293742;
    border: 1px solid #4b5a66;
    border-radius: 9px;
    transition: .15s;
}

button:hover:not(:disabled) {
    background: #364956;
    transform: translateY(-1px);
}

button:disabled {
    opacity: .42;
    cursor: not-allowed;
    transform: none;
}

.primary {
    background: #456f99;
    border-color: #6b98c0;
}

.primary:hover:not(:disabled) {
    background: #5485b2;
}

.good {
    background: #356548;
    border-color: #57916d;
}

.danger {
    background: #6a3d3d;
    border-color: #955b5b;
}

.tutorial {
    background: #202d38;
    border: 1px solid #6587a3;
    border-radius: 11px;
    padding: 13px;
    margin-bottom: 17px;
}

.tutorial-title {
    font-weight: 800;
    margin-bottom: 5px;
}

.tutorial-text {
    color: #c7d1da;
    line-height: 1.5;
}

.story {
    background: #111920;
    border-left: 4px solid #6a8ba7;
    border-radius: 8px;
    padding: 14px;
    margin-top: 17px;
    color: #c7d1da;
}

.story.boss {
    border-left-color: #a96060;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
    margin-top: 18px;
}

.card {
    background: #202b35;
    border: 1px solid #394854;
    border-radius: 12px;
    padding: 15px;
}

.card-icon {
    font-size: 37px;
    margin-bottom: 7px;
}

.center {
    text-align: center;
    padding: 45px 10px;
}

.big-icon {
    font-size: 82px;
}

/* MAP */

.map {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #52616d;
    background:
        linear-gradient(
            to bottom,
            #8ebbd0 0%,
            #b7d2d7 49%,
            #6d9258 49%,
            #567448 100%
        );
}

.map-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 135px);
    gap: 10px;
    max-width: 850px;
    margin: auto;
}

.map-place {
    border: 2px solid #465761;
    border-radius: 13px;
    background: rgba(24, 33, 42, .94);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    text-align: center;
}

.map-place span {
    font-size: 30px;
}

.map-place small {
    color: #aab7c2;
}

.map-place.current {
    border-color: #82aed1;
    box-shadow: inset 0 0 0 1px #82aed1;
}

.map-place.locked {
    opacity: .48;
}

.map-forest {
    grid-column: 1;
    grid-row: 2;
}

.map-ruins {
    grid-column: 2;
    grid-row: 2;
}

.map-mines {
    grid-column: 3;
    grid-row: 2;
}

.map-fields {
    grid-column: 1;
    grid-row: 3;
}

.map-town {
    grid-column: 2;
    grid-row: 3;
}

.map-peak {
    grid-column: 2;
    grid-row: 1;
}

.map-info {
    margin-top: 13px;
    padding: 15px;
    background: #202a34;
    border: 1px solid #3b4a56;
    border-radius: 12px;
}

/* SHOP */

.shop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}

.tabs {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.tab.active {
    background: #456f99;
    border-color: #6d9bc5;
}

.shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
    margin-top: 17px;
}

.shop-card {
    background: #202a34;
    border: 1px solid #394854;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.shop-card.equipped {
    border-color: #719bc0;
    box-shadow: inset 0 0 0 1px #719bc0;
}

.shop-icon {
    font-size: 43px;
}

.shop-cost {
    background: #121a21;
    border-radius: 8px;
    padding: 9px;
    margin-top: 9px;
    color: #bac6cf;
    font-size: 13px;
}

.shop-card .actions {
    margin-top: auto;
}

/* HEALING */

.heal-box {
    max-width: 700px;
    margin: 20px auto;
    background: #202b35;
    border: 1px solid #3b4955;
    border-radius: 13px;
    padding: 18px;
}

.heal-display {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 18px;
    font-weight: bold;
}

input[type="range"] {
    width: 100%;
    margin: 20px 0;
}

/* COMBAT */

.arena {
    position: relative;
    height: 370px;
    overflow: hidden;
    border: 1px solid #53616d;
    border-radius: 14px;
    background:
        linear-gradient(
            to bottom,
            #8ebbd0 0%,
            #b8d2d8 55%,
            #6e9159 55%,
            #577548 100%
        );
}

.cloud {
    position: absolute;
    top: 45px;
    left: 12%;
    width: 100px;
    height: 30px;
    border-radius: 30px;
    background: rgba(255,255,255,.52);
}

.cloud.two {
    left: 72%;
    top: 72px;
    transform: scale(.7);
}

/* PLAYER */

.player {
    position: absolute;
    bottom: 55px;
    left: 16%;
    width: 78px;
    height: 125px;
    z-index: 5;
}

.player-head {
    position: absolute;
    width: 42px;
    height: 42px;
    background: #e5b08b;
    border-radius: 50%;
    left: 18px;
    top: 0;
    border: 3px solid #27313a;
}

.player-body {
    position: absolute;
    width: 55px;
    height: 58px;
    background: #5a7895;
    border-radius: 15px 15px 8px 8px;
    left: 11px;
    top: 36px;
    border: 3px solid #27313a;
}

.player-leg {
    position: absolute;
    width: 15px;
    height: 38px;
    background: #343e47;
    bottom: 0;
    border-radius: 7px;
}

.player-leg.left {
    left: 18px;
}

.player-leg.right {
    left: 45px;
}

.player-sword {
    position: absolute;
    width: 9px;
    height: 73px;
    background: #d5e1e7;
    right: -10px;
    top: 37px;
    transform: rotate(-36deg);
    border-radius: 6px;
    border: 2px solid #6a7780;
}

.player-sword::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 7px;
    background: #8b6848;
    left: -9px;
    bottom: 0;
    border-radius: 4px;
}

/* MONSTER */

.monster {
    position: absolute;
    right: 14%;
    bottom: 50px;
    width: 145px;
    height: 145px;
    z-index: 5;
}

.monster-body {
    position: absolute;
    left: 24px;
    top: 27px;
    width: 100px;
    height: 105px;
    border-radius: 45% 45% 42% 42%;
    border: 4px solid #26313a;
}

.monster-eye {
    position: absolute;
    width: 17px;
    height: 22px;
    background: white;
    border: 3px solid #20282e;
    border-radius: 50%;
    z-index: 3;
    top: 52px;
}

.monster-eye::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 9px;
    background: #15191d;
    border-radius: 50%;
    left: 3px;
    top: 4px;
}

.monster-eye.left {
    left: 52px;
}

.monster-eye.right {
    left: 77px;
}

.monster-mouth {
    position: absolute;
    left: 59px;
    top: 82px;
    width: 36px;
    height: 17px;
    border-bottom: 4px solid #20282e;
    border-radius: 50%;
    z-index: 4;
}

.horn {
    position: absolute;
    width: 28px;
    height: 55px;
    background: #4a555e;
    border: 4px solid #26313a;
    border-radius: 60% 60% 20% 20%;
    top: 0;
    z-index: 1;
}

.horn.left {
    left: 22px;
    transform: rotate(-25deg);
}

.horn.right {
    right: 22px;
    transform: rotate(25deg);
}

/* SLIME */

.monster.slime .monster-body {
    background: #4da869;
    border-radius: 48% 48% 35% 35%;
}

.monster.slime .horn,
.monster.slime .monster-mouth {
    display: none;
}

/* WOLF */

.monster.wolf .monster-body {
    background: #7c8389;
    border-radius: 48% 48% 35% 35%;
}

.monster.wolf .horn {
    background: #646a70;
    width: 25px;
    height: 35px;
}

.monster.wolf .monster-mouth {
    border-bottom: 0;
    border-top: 4px solid #20282e;
}

/* GOBLIN */

.monster.goblin .monster-body {
    background: #5f994f;
}

.monster.goblin .horn {
    background: #4b7e40;
    height: 45px;
}

/* ORC */

.monster.orc .monster-body {
    background: #6f775e;
    transform: scale(1.12);
}

.monster.orc .horn {
    background: #46483b;
    height: 65px;
}

.monster.orc .monster-mouth::before,
.monster.orc .monster-mouth::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 12px;
    background: white;
    top: 3px;
}

.monster.orc .monster-mouth::before {
    left: 7px;
}

.monster.orc .monster-mouth::after {
    right: 7px;
}

/* YETI */

.monster.yeti .monster-body {
    background: #d4dce2;
}

.monster.yeti .horn {
    background: #aebac2;
    height: 34px;
}

.monster.yeti .monster-eye {
    background: #e1effa;
}

/* GUARDIAN */

.monster.guardian .monster-body {
    background:
        linear-gradient(
            145deg,
            #777c80,
            #474d52
        );
    border-radius: 30%;
}

.monster.guardian .horn {
    background: #686e72;
}

.monster.guardian .monster-mouth {
    border-bottom: 0;
    border-top: 4px solid #182027;
}

/* DRAGON */

.monster.dragon {
    transform: scale(1.15);
}

.monster.dragon .monster-body {
    background:
        linear-gradient(
            145deg,
            #a74445,
            #5d232e
        );
    border-radius: 45% 55% 35% 45%;
}

.monster.dragon .horn {
    background: #d9c0a2;
    height: 62px;
}

.monster.dragon .wing {
    position: absolute;
    width: 72px;
    height: 85px;
    top: 37px;
    background: #6d2c36;
    border: 4px solid #26313a;
    z-index: 0;
}

.monster.dragon .wing.left {
    left: -7px;
    transform: skewY(25deg);
}

.monster.dragon .wing.right {
    right: -7px;
    transform: skewY(-25deg);
}

.monster.dragon .tail {
    position: absolute;
    width: 70px;
    height: 18px;
    background: #6d2c36;
    border: 4px solid #26313a;
    bottom: 17px;
    right: -45px;
    border-radius: 40%;
    transform: rotate(18deg);
}

/* COMBAT ANIMATIONS */

.player.attack {
    animation: playerAttack .5s ease;
}

.monster.hit {
    animation: monsterHit .35s ease;
}

.slash {
    position: absolute;
    z-index: 8;
    right: 29%;
    bottom: 135px;
    font-size: 80px;
    opacity: 0;
}

.slash.show {
    animation: slash .38s ease;
}

.damage-number {
    position: absolute;
    z-index: 9;
    right: 19%;
    bottom: 185px;
    font-size: 31px;
    font-weight: 900;
    opacity: 0;
}

.damage-number.show {
    animation: damageUp .7s ease;
}

@keyframes playerAttack {
    0% {
        transform: translateX(0) rotate(0);
    }

    45% {
        transform: translateX(155px) rotate(-10deg);
    }

    100% {
        transform: translateX(0) rotate(0);
    }
}

@keyframes monsterHit {
    0%, 100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(16px) rotate(5deg);
    }

    50% {
        transform: translateX(-13px) rotate(-5deg);
    }

    75% {
        transform: translateX(7px);
    }
}

@keyframes slash {
    0% {
        opacity: 0;
        transform: rotate(-45deg) scale(.4);
    }

    35% {
        opacity: 1;
        transform: rotate(10deg) scale(1.1);
    }

    100% {
        opacity: 0;
        transform: rotate(38deg) scale(1.3);
    }
}

@keyframes damageUp {
    0% {
        opacity: 0;
        transform: translateY(10px);
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-48px);
    }
}

.battle-bars {
    display: grid;
    gap: 10px;
    margin-top: 14px;
}

.bar-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    color: #bac5ce;
    font-size: 13px;
}

.bar {
    height: 15px;
    background: #202b33;
    border-radius: 20px;
    overflow: hidden;
}

.fill {
    height: 100%;
    transition: width .25s;
}

.hp-fill {
    background: #5ea36b;
}

.enemy-fill {
    background: #c56565;
}

.battle-log {
    margin-top: 13px;
    padding: 11px;
    min-height: 45px;
    background: #10171d;
    border: 1px solid #303e49;
    border-radius: 8px;
    color: #c5d0d8;
}

/* SELLING */

.sell-note {
    margin-top: 12px;
    color: #aebac4;
}

.sell-disabled {
    color: #a96a6a;
    font-size: 13px;
}

/* DEATH / END */

.big-end {
    font-size: 88px;
}

.ending-title {
    font-size: 34px;
}

@media (max-width: 750px) {

    #game {
        width: 97%;
    }

    .screen {
        padding: 14px;
    }

    .map-grid {
        grid-template-rows: repeat(3, 115px);
        gap: 7px;
    }

    .map-place {
        border-radius: 9px;
        padding: 7px;
        font-size: 12px;
    }

    .map-place span {
        font-size: 24px;
    }

    .player {
        left: 6%;
        transform: scale(.8);
        transform-origin: bottom left;
    }

    .monster {
        right: 5%;
        transform: scale(.8);
        transform-origin: bottom right;
    }

    .monster.dragon {
        transform: scale(.9);
        transform-origin: bottom right;
    }

    @keyframes playerAttack {
        0% {
            transform: scale(.8) translateX(0);
        }

        45% {
            transform: scale(.8) translateX(90px);
        }

        100% {
            transform: scale(.8) translateX(0);
        }
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
    }
}
</style>
</head>

function random(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function weaponAttack() {
    const item = weapons[state.equippedWeapon];
    return item.attack + state.weaponUpgrades[state.equippedWeapon] * 2;
}

function maxHP() {
    const item = armor[state.equippedArmor];
    return state.baseHp + item.hp +
        state.armorUpgrades[state.equippedArmor] * 10;
}

function hasMaterials(materials) {
    return Object.entries(materials).every(
        ([name, amount]) =>
            state.resources[name] >= amount
    );
}

function spendMaterials(materials) {
    for (const [name, amount] of Object.entries(materials)) {
        state.resources[name] -= amount;
    }
}

function materialText(materials) {
    const parts = Object.entries(materials);

    if (!parts.length) {
        return "None";
    }

    return parts
        .map(([name, amount]) => `${amount} ${name}`)
        .join(" • ");
}

    render(`

            Healing costs <b>1 gold for every 2 HP</b>.
        </p>

            >

            <div class="muted">
                Current HP:
                ${state.hp}/${maxHP()}
                &nbsp; • &nbsp;
                Gold:
                ${state.gold}
            </div>

                <button
                    class="primary"
                    id="healConfirm"

                >
                    ❤️ Heal
                </button>

                <button data-action="town">
                    Back
                </button>

            </div>

        </div>
    `);

    const slider = document.getElementById("healSlider");
    const amount = document.getElementById("healAmount");
    const cost = document.getElementById("healCost");
    const confirm = document.getElementById("healConfirm");

    function updateHealing() {
        const hp = Number(slider.value);

        const price = Math.ceil(hp / 2);

        amount.textContent = hp;
        cost.textContent = price;

        confirm.disabled = state.gold < price;
    }

    slider.addEventListener("input", updateHealing);

    updateHealing();
}

function confirmHealing() {
    const slider = document.getElementById("healSlider");

    if (!slider) {
        return;
    }

    const hp = Number(slider.value);
    const cost = Math.ceil(hp / 2);

    if (cost > state.gold) {
        return;
    }

    const actual = Math.min(
        hp,
        maxHP() - state.hp
    );

    state.gold -= Math.ceil(actual / 2);
    state.hp += actual;

    healMenu();
}

function shop(tab = state.shopTab) {
    state.shopTab = tab;

    if (tab === "sell") {
        sellingShop();
        return;
    }

    const list =
        tab === "weapons"
        ? weapons
        : armor;

    const owned =
        tab === "weapons"
        ? state.ownedWeapons
        : state.ownedArmor;

    const equipped =
        tab === "weapons"
        ? state.equippedWeapon
        : state.equippedArmor;

    const upgrades =
        tab === "weapons"
        ? state.weaponUpgrades
        : state.armorUpgrades;

    let cards = "";

    list.forEach((item, index) => {

        const isOwned =
            owned.includes(index);

        const isEquipped =
            equipped === index;

        const previousOwned =
            index === 0 ||
            owned.includes(index - 1);

        const currentValue =
            tab === "weapons"
            ? item.attack +
              upgrades[index] * 2
            : item.hp +
              upgrades[index] * 10;

        const canBuy =
            isOwned ||
            (
                previousOwned &&
                state.gold >= item.price &&
                hasMaterials(item.materials)
            );

        let buyText = "";

        if (isEquipped) {
            buyText = "✅ Equipped";
        } else if (isOwned) {
            buyText = "Equip";
        } else if (!previousOwned) {
            buyText = "🔒 Buy Previous Tier";
        } else {
            buyText = `Buy 🪙 ${item.price}`;
        }

        let upgradeHTML = "";

        if (isOwned && isEquipped) {

            const level =
                upgrades[index];

            if (level < 5) {

                const upgradePrice =
                    35 + level * 25;

                const upgradeMaterials = {
                    iron: level + 1
                };

                if (tab === "armor") {
                    upgradeMaterials.leather =
                        level === 0 ? 1 : 0;
                }

                const canUpgrade =
                    state.gold >= upgradePrice &&
                    hasMaterials(upgradeMaterials);

                upgradeHTML = `
                    <button
                        class="primary"
                        data-action="upgradeGear"
                        data-tab="${tab}"
                        data-index="${index}"
                        ${canUpgrade ? "" : "disabled"}
                    >
                        ${
                            tab === "weapons"
                            ? "⚔️ Upgrade Weapon"
                            : "🛡️ Upgrade Armor"
                        }

                        <br>

                        <small>
                            🪙 ${upgradePrice}
                            •
                            ${materialText(upgradeMaterials)}
                        </small>
                    </button>
                `;
            } else {

                upgradeHTML = `
                    <button disabled>
                        ⭐ Fully Upgraded
                    </button>
                `;
            }
        }

        cards += `

            <div class="shop-card ${isEquipped ? "equipped" : ""}">

                <div class="shop-icon">
                    ${item.icon}
                </div>

                <h3>
                    ${item.name}
                </h3>

                <p class="muted">

                    ${
                        tab === "weapons"
                        ? `Attack: <b>${currentValue}</b>`
                        : `Bonus HP: <b>+${currentValue}</b>`
                    }

                    <br>

                    Upgrade:
                    <b>${upgrades[index]}/5</b>

                </p>

                ${
                    !isOwned && index > 0
                    ? `
                        <div class="shop-cost">
                            🪙 ${item.price}
                            <br><br>
                            ${materialText(item.materials)}
                        </div>
                    `
                    : ""
                }

                <div class="actions">

                    <button
                        data-action="buyEquip"
                        data-tab="${tab}"
                        data-index="${index}"
                        ${canBuy ? "" : "disabled"}
                    >
                        ${buyText}
                    </button>

                    ${upgradeHTML}

                </div>

            </div>
        `;
    });

    render(`

        ${tutorial(
            "The Blacksmith Shop",
            `
                <b>Weapons</b> increase your attack.
                <b>Armor</b> increases your maximum HP.
                They have separate upgrade paths.
                Monsters provide the materials you need.
            `
        )}

        <div class="shop-header">

            <div>
                <h2>⚒️ Blacksmith Shop</h2>
                <p class="muted">
                    Buy, equip, and upgrade your gear.
                </p>
            </div>

            <div class="tabs">

                <button
                    class="tab ${tab === "weapons" ? "active" : ""}"
                    data-action="shopWeapons"
                >
                    ⚔️ Weapons
                </button>

                <button
                    class="tab ${tab === "armor" ? "active" : ""}"
                    data-action="shopArmor"
                >
                    🛡️ Armor
                </button>

                <button
                    class="tab ${tab === "sell" ? "active" : ""}"
                    data-action="shopSell"
                >
                    🪙 Sell
                </button>

            </div>

        </div>

        <div class="shop-grid">
            ${cards}
        </div>

        <div class="actions">

            <button data-action="town">
                🏘️ Back to Town
            </button>

            <button data-action="map">
                🗺️ Map
            </button>

        </div>

    `);
}

/* =========================================================
   BUY / EQUIP
========================================================= */

function buyEquip(index, tab) {

    const list =
        tab === "weapons"
        ? weapons
        : armor;

    const owned =
        tab === "weapons"
        ? state.ownedWeapons
        : state.ownedArmor;

    const item = list[index];

    if (owned.includes(index)) {

        if (tab === "weapons") {
            state.equippedWeapon = index;
        } else {
            state.equippedArmor = index;
            state.hp = Math.min(
                state.hp,
                maxHP()
            );
        }

        shop(tab);
        return;
    }

    if (
        index > 0 &&
        !owned.includes(index - 1)
    ) {
        return;
    }

    if (state.gold < item.price) {
        return;
    }

    if (!hasMaterials(item.materials)) {
        return;
    }

    state.gold -= item.price;

    spendMaterials(item.materials);

    owned.push(index);

    if (tab === "weapons") {
        state.equippedWeapon = index;
    } else {
        state.equippedArmor = index;
        state.hp = maxHP();
    }

    shop(tab);
}


/* =========================================================
   UPGRADE
========================================================= */

function upgradeGear(index, tab) {

    const upgrades =
        tab === "weapons"
        ? state.weaponUpgrades
        : state.armorUpgrades;

    const equipped =
        tab === "weapons"
        ? state.equippedWeapon
        : state.equippedArmor;

    if (index !== equipped) {
        return;
    }

    if (upgrades[index] >= 5) {
        return;
    }

    const level =
        upgrades[index];

    const goldCost =
        35 + level * 25;

    const materials = {
        iron: level + 1
    };

    if (tab === "armor" && level === 0) {
        materials.leather = 1;
    }

    if (
        state.gold < goldCost ||
        !hasMaterials(materials)
    ) {
        return;
    }

    state.gold -= goldCost;

    spendMaterials(materials);

    upgrades[index]++;

    if (tab === "armor") {
        state.hp = Math.min(
            maxHP(),
            state.hp + 10
        );
    }

    shop(tab);
}


/* =========================================================
   SELL
========================================================= */

function sellGear(type, index) {

    if (type === "weapon") {

        if (
            state.equippedWeapon === index ||
            !state.ownedWeapons.includes(index)
        ) {
            return;
        }

        const upgrades =
            state.weaponUpgrades[index];

        const value =
            Math.floor(
                weapons[index].price * 0.55
            ) + upgrades * 15;

        state.gold += value;

        state.ownedWeapons =
            state.ownedWeapons.filter(
                item => item !== index
            );

        state.weaponUpgrades[index] = 0;

        shop("sell");

        return;
    }

    if (type === "armor") {

        if (
            state.equippedArmor === index ||
            !state.ownedArmor.includes(index)
        ) {
            return;
        }

        const upgrades =
            state.armorUpgrades[index];

        const value =
            Math.floor(
                armor[index].price * 0.55
            ) + upgrades * 15;

        state.gold += value;

        state.ownedArmor =
            state.ownedArmor.filter(
                item => item !== index
            );

        state.armorUpgrades[index] = 0;

        shop("sell");
    }
}


/* =========================================================
   LEVELING
========================================================= */

function levelUpCheck() {

    let leveled = false;

    while (
        state.xp >=
        state.level * 45
    ) {

        state.xp -= state.level * 45;

        state.level++;

        state.baseHp += 12;

        state.hp = maxHP();

        leveled = true;
    }

    return leveled;
}

        ? `
            <div class="wing left"></div>
            <div class="wing right"></div>
            <div class="tail"></div>
        `
        : "";

    return `
        <div
            class="monster ${enemy.type}"
            id="monster"
        >

            ${wings}

            <div class="horn left"></div>
            <div class="horn right"></div>

            <div class="monster-body"></div>

            <div class="monster-eye left"></div>
            <div class="monster-eye right"></div>

            <div class="monster-mouth"></div>

        </div>
    `;
}


/* =========================================================
   EXPLORE
========================================================= */

function explore() {

    if (
        state.location === "ArdenVille"
    ) {
        map();
        return;
    }

    const pool =
        enemyPools[state.location];

    if (!pool) {
        return;
    }

    const enemyKey =
        pool[
            Math.floor(
                Math.random() * pool.length
            )
        ];

    startCombat(enemyKey);
}


/* =========================================================
   COMBAT
========================================================= */

function startCombat(enemyKey) {

    const enemy =
        enemies[enemyKey];

    state.enemy = enemyKey;
    state.enemyHP = enemy.hp;
    state.battleBusy = false;
    state.defending = false;
    state.potions = 2;

    render(`

        ${tutorial(
            "Combat",
            `
                <b>Attack</b> damages the enemy.
                <b>Defend</b> halves the next hit.
                <b>Heal</b> restores 30 HP.
                <b>Run</b> has an 80% chance to work.
                After your turn, the monster attacks.
            `
        )}

        <h2>
            ${enemy.name}
        </h2>

        <div class="arena">

            <div class="cloud"></div>
            <div class="cloud two"></div>

            <div class="player" id="player">

                <div class="player-head"></div>

                <div class="player-body"></div>

                <div class="player-leg left"></div>
                <div class="player-leg right"></div>

                <div class="player-sword"></div>

            </div>

            <div
                class="slash"
                id="slash"
            >
                ⚔️
            </div>

            <div
                class="damage-number"
                id="damageNumber"
            >
            </div>

            ${enemyHTML(enemy)}

        </div>


        <div class="battle-bars">

            <div>

                <div class="bar-label">
                    <span>YOU</span>
                    <span id="playerBarText"></span>
                </div>

                <div class="bar">
                    <div
                        class="fill hp-fill"
                        id="playerBar"
                    ></div>
                </div>

            </div>


            <div>

                <div class="bar-label">
                    <span>${enemy.name}</span>
                    <span id="enemyBarText"></span>
                </div>

                <div class="bar">
                    <div
                        class="fill enemy-fill"
                        id="enemyBar"
                    ></div>
                </div>

            </div>

        </div>


        <div class="actions">

            <button
                class="primary"
                id="attack"
                data-action="attack"
            >
                ⚔️ Attack
            </button>

            <button
                id="defend"
                data-action="defend"
            >
                🛡️ Defend
            </button>

            <button
                id="healBattle"
                data-action="healBattle"
            >
                ❤️ Heal (2)
            </button>

            <button
                class="danger"
                id="run"
                data-action="run"
                ${state.enemy === "Dragon" ? "disabled" : ""}
            >
                🏃 Run
            </button>

        </div>


        <div
            class="battle-log"
            id="battleLog"
        >
            Your turn.
        </div>
    `);

    updateBattle();
}


/* =========================================================
   BATTLE UI
========================================================= */

function updateBattle() {

    const enemy =
        enemies[state.enemy];

    if (!enemy) {
        return;
    }

    const playerBar =
        document.getElementById("playerBar");

    const enemyBar =
        document.getElementById("enemyBar");

    const playerText =
        document.getElementById("playerBarText");

    const enemyText =
        document.getElementById("enemyBarText");

    if (playerBar) {
        playerBar.style.width =
            `${Math.max(
                0,
                state.hp / maxHP() * 100
            )}%`;
    }

    if (enemyBar) {
        enemyBar.style.width =
            `${Math.max(
                0,
                state.enemyHP / enemy.hp * 100
            )}%`;
    }

    if (playerText) {
        playerText.textContent =
            `${Math.max(0, state.hp)}/${maxHP()}`;
    }

    if (enemyText) {
        enemyText.textContent =
            `${Math.max(0, state.enemyHP)}/${enemy.hp}`;
    }

    const healButton =
        document.getElementById("healBattle");

    if (healButton) {

        healButton.textContent =
            `❤️ Heal (${state.potions})`;

        healButton.disabled =
            state.battleBusy ||
            state.potions <= 0;
    }
}

function battleButtons(disabled) {

    ["attack", "defend", "healBattle", "run"]
        .forEach(id => {

            const button =
                document.getElementById(id);

            if (button) {
                button.disabled = disabled;
            }
        });

    const heal =
        document.getElementById("healBattle");

    if (heal) {
        heal.disabled =
            disabled ||
            state.potions <= 0;
    }

    if (state.enemy === "Dragon") {

        const run =
            document.getElementById("run");

        if (run) {
            run.disabled = true;
        }
    }
}


/* =========================================================
   ATTACK
========================================================= */

function playerAttack() {

    if (state.battleBusy) {
        return;
    }

    state.battleBusy = true;

    battleButtons(true);

    const player =
        document.getElementById("player");

    const monster =
        document.getElementById("monster");

    const slash =
        document.getElementById("slash");

    const damageNumber =
        document.getElementById("damageNumber");

    const damage =
        Math.max(
            1,
            weaponAttack() +
            random(-2, 3)
        );

    player.classList.remove("attack");
    void player.offsetWidth;
    player.classList.add("attack");


    setTimeout(() => {

        state.enemyHP =
            Math.max(
                0,
                state.enemyHP - damage
            );


        slash.classList.remove("show");
        void slash.offsetWidth;
        slash.classList.add("show");


        damageNumber.textContent =
            `-${damage}`;

        damageNumber.classList.remove("show");
        void damageNumber.offsetWidth;
        damageNumber.classList.add("show");


        monster.classList.remove("hit");
        void monster.offsetWidth;
        monster.classList.add("hit");


        updateBattle();


        if (state.enemyHP <= 0) {

            setTimeout(
                victory,
                500
            );

            return;
        }


        setTimeout(
            enemyTurn,
            500
        );

    }, 280);
}


/* =========================================================
   DEFEND
========================================================= */

function playerDefend() {

    if (state.battleBusy) {
        return;
    }

    state.battleBusy = true;
    state.defending = true;

    battleButtons(true);

    const log =
        document.getElementById("battleLog");

    log.textContent =
        "You raise your guard. The next attack will be reduced.";

    setTimeout(
        enemyTurn,
        350
    );
}


/* =========================================================
   HEAL IN BATTLE
========================================================= */

function playerHealBattle() {

    if (
        state.battleBusy ||
        state.potions <= 0
    ) {
        return;
    }

    if (state.hp >= maxHP()) {

        const log =
            document.getElementById("battleLog");

        log.textContent =
            "Your health is already full.";

        return;
    }

    state.battleBusy = true;
    battleButtons(true);

    state.potions--;

    const amount =
        Math.min(
            30,
            maxHP() - state.hp
        );

    state.hp += amount;

    updateBattle();

    const log =
        document.getElementById("battleLog");

    log.textContent =
        `You restored ${amount} HP.`;

    setTimeout(
        enemyTurn,
        400
    );
}


/* =========================================================
   ENEMY TURN
========================================================= */

function enemyTurn() {

    if (
        !state.enemy ||
        state.enemyHP <= 0
    ) {
        return;
    }

    const enemy =
        enemies[state.enemy];

    let damage =
        enemy.attack +
        random(-1, 2);

    if (state.defending) {

        damage =
            Math.floor(damage / 2);

        state.defending = false;
    }

    damage =
        Math.max(1, damage);

    state.hp =
        Math.max(
            0,
            state.hp - damage
        );

    updateBattle();

    const log =
        document.getElementById("battleLog");

    if (log) {
        log.textContent =
            `${enemy.name} attacked you for ${damage} damage.`;
    }


    if (state.hp <= 0) {

        setTimeout(
            playerDeath,
            450
        );

        return;
    }


    state.battleBusy = false;

    battleButtons(false);
}


/* =========================================================
   RUN
========================================================= */

function runAway() {

    if (
        state.battleBusy ||
        state.enemy === "Dragon"
    ) {
        return;
    }

    state.battleBusy = true;
    battleButtons(true);

    if (Math.random() < .8) {

        state.enemy = null;
        state.enemyHP = 0;

        area();

        return;
    }

    const log =
        document.getElementById("battleLog");

    log.textContent =
        "You failed to escape!";

    setTimeout(
        enemyTurn,
        350
    );
}


/* =========================================================
   VICTORY
========================================================= */

function victory() {

    const enemy =
        enemies[state.enemy];

    const enemyName =
        enemy.name;


    const gold =
        random(
            enemy.gold[0],
            enemy.gold[1]
        );

    state.gold += gold;
    state.xp += enemy.xp;


    const loot = {};

    for (
        const [resource, range]
        of Object.entries(enemy.loot)
    ) {

        const amount =
            random(
                range[0],
                range[1]
            );

        if (amount > 0) {
            state.resources[resource] += amount;
            loot[resource] = amount;
        }
    }


    const leveled =
        levelUpCheck();


    const wasDragon =
        state.enemy === "Dragon" &&
        state.location === "Dragon Peak";


    state.enemy = null;
    state.enemyHP = 0;
    state.battleBusy = false;


    if (wasDragon) {

        ending();
        return;
    }


    const lootText =
        Object.entries(loot)
            .map(
                ([name, amount]) =>
                    `${amount} ${name}`
            )
            .join(" • ");


    render(`

        <div class="center">

            <div class="big-icon">
                🏆
            </div>

            <h2>
                Victory!
            </h2>

            <p class="description">
                You defeated
                <b>${enemyName}</b>.
            </p>

            <div class="cards">

                <div class="card">
                    🪙<br>
                    <b>+${gold} Gold</b>
                </div>

                <div class="card">
                    ✨<br>
                    <b>+${enemy.xp} XP</b>
                </div>

                <div class="card">
                    🧱<br>
                    <b>${lootText || "No resources"}</b>
                </div>

            </div>

            ${
                leveled
                ? `
                    <div class="story">

                        ⭐ <b>LEVEL UP!</b>

                        <br><br>

                        You reached
                        <b>Level ${state.level}</b>.

                        <br>

                        Your base HP increased.

                    </div>
                `
                : ""
            }

            <div class="actions"
                 style="justify-content:center">

                <button
                    class="primary"
                    data-action="area"
                >
                    🔎 Return to Area
                </button>

                <button data-action="shop">
                    ⚒️ Shop
                </button>

                <button data-action="map">
                    🗺️ Map
                </button>

            </div>

        </div>
    `);
}


/* =========================================================
   LEVEL UP
========================================================= */

function levelUpCheck() {

    let leveled = false;

    while (
        state.xp >=
        state.level * 45
    ) {

        state.xp -=
            state.level * 45;

        state.level++;

        state.baseHp += 12;

        state.hp = maxHP();

        leveled = true;
    }

    return leveled;
}


/* =========================================================
   DEATH
========================================================= */

function playerDeath() {

    const lost =
        Math.floor(
            state.gold * .20
        );

    state.gold -= lost;

    state.location =
        "ArdenVille";

    state.hp =
        Math.max(
            1,
            Math.floor(
                maxHP() * .5
            )
        );

    state.enemy = null;
    state.enemyHP = 0;
    state.battleBusy = false;

    render(`

        <div class="center">

            <div class="big-end">
                💀
            </div>

            <h2 class="ending-title">
                You Were Defeated
            </h2>

            <p class="description">
                A traveler found you and
                carried you back to ArdenVille.
            </p>

            <div class="story">

                You lost
                <b>${lost} gold</b>.

                <br><br>

                You kept your:

                <br><br>

                ⚔️ Weapons<br>
                🛡️ Armor<br>
                ⬆️ Gear upgrades<br>
                ⭐ Level<br>
                ✨ XP<br>
                🧱 Resources

                <br><br>

                You wake up in town with
                <b>${state.hp} HP</b>.

            </div>

            <div class="actions"
                 style="justify-content:center">

                <button
                    class="primary"
                    data-action="town"
                >
                    🏘️ Return to Town
                </button>

            </div>

        </div>
    `);
}


/* =========================================================
   FINAL BOSS / ENDING
========================================================= */

function challengeDragon() {

    if (
        state.location !== "Dragon Peak" ||
        state.level < 6
    ) {
        return;
    }

    startCombat("Dragon");
}

function ending() {

    state.gameWon = true;

    render(`

        <div class="center">

            <div class="big-end">
                🐉✨
            </div>

            <h1 class="ending-title">
                THE END OF AVALORIA
            </h1>

            <p class="description">
                The Ancient Dragon falls.
            </p>

            <div class="story">

                <b>🌄 The realm is saved.</b>

                <br><br>

                The corruption surrounding
                Dragon Peak disappears.

                <br><br>

                The forests begin to heal.
                The ancient ruins glow again.
                The people of ArdenVille finally
                see a clear sky.

                <br><br>

                You entered Avaloria as a stranger.

                <br><br>

                You leave it as the hero
                who saved the realm.

            </div>

            <div class="cards">

                <div class="card">
                    🏆<br>
                    Dragon Defeated
                </div>

                <div class="card">
                    ⭐<br>
                    Level ${state.level}
                </div>

                <div class="card">
                    ⚔️<br>
                    Attack ${weaponAttack()}
                </div>

                <div class="card">
                    🪙<br>
                    ${state.gold} Gold
                </div>

            </div>

            <div class="actions"
                 style="justify-content:center">

                <button
                    class="primary"
                    data-action="restart"
                >
                    🔄 Play Again
                </button>

            </div>

        </div>
    `);
}


/* =========================================================
   AREA SCREEN
========================================================= */

function area() {

    const data =
        areas[state.location];

    const boss =
        state.location === "Dragon Peak" &&
        state.level >= 6;

    render(`

        <h2>
            ${data.icon}
            ${state.location}
        </h2>

        <p class="description">
            ${data.description}
        </p>

        ${
            boss
            ? `
                <div class="story boss">

                    🐉 <b>The Ancient Dragon is here.</b>

                    <br><br>

                    Make sure your weapon and armor
                    are upgraded before fighting it.

                </div>
            `
            : ""
        }

        <div class="actions">

            <button
                class="primary"
                data-action="explore"
            >
                🔎 Explore
            </button>

            ${
                boss
                ? `
                    <button
                        class="danger"
                        data-action="dragon"
                    >
                        🐉 Fight Dragon
                    </button>
                `
                : ""
            }

            <button data-action="map">
                🗺️ Map
            </button>

            <button data-action="town">
                🏘️ Town
            </button>

        </div>

        <div class="story">

            💡 <b>Tip:</b>

            Stronger areas give better loot.
            Bring those materials back to the
            blacksmith and turn them into better gear.

        </div>
    `);
}


/* =========================================================
   BUTTON HANDLER
========================================================= */

game.addEventListener("click", event => {

    const button =
        event.target.closest("[data-action]");

    if (!button) {
        return;
    }

    const action =
        button.dataset.action;

    switch (action) {

        case "town":
            town();
            break;

        case "map":
            map();
            break;

        case "shop":
            shop();
            break;

        case "shopWeapons":
            shop("weapons");
            break;

        case "shopArmor":
            shop("armor");
            break;

        case "shopSell":
            shop("sell");
            break;

        case "healMenu":
            healMenu();
            break;

        case "healConfirm":
            confirmHealing();
            break;

        case "selectMap":
            state.selectedPlace =
                button.dataset.place;
            map();
            break;

        case "travel": {

            const target =
                state.selectedPlace;

            if (
                !areas[target] ||
                state.level <
                areas[target].level
            ) {
                return;
            }

            state.location = target;

            if (target === "ArdenVille") {
                town();
            } else {
                area();
            }

            break;
        }

        case "explore":
            explore();
            break;

        case "buyEquip":
            buyEquip(
                Number(button.dataset.index),
                button.dataset.tab
            );
            break;

        case "upgradeGear":
            upgradeGear(
                Number(button.dataset.index),
                button.dataset.tab
            );
            break;

        case "sellGear":
            sellGear(
                button.dataset.type,
                Number(button.dataset.index)
            );
            break;

        case "attack":
            playerAttack();
            break;

        case "defend":
            playerDefend();
            break;

        case "healBattle":
            playerHealBattle();
            break;

        case "run":
            runAway();
            break;

        case "area":
            area();
            break;

        case "dragon":
            challengeDragon();
            break;

        case "restart":
            location.reload();
            break;
    }
});


/* =========================================================
   START
========================================================= */

render(`

    <div class="center">

        <div class="big-icon">
            🌄
        </div>

        <h1>
            Avaloria: The Lost Realm
        </h1>

        <p class="description">
            You awaken in a strange land after
            witnessing a massive fireball.
        </p>

        <div class="story">

            🧑 <b>Stranger:</b>

            <br><br>

            “Welcome to Avaloria.
            If you want answers,
            you're going to need to survive first.”

        </div>

        <div class="actions"
             style="justify-content:center">

            <button
                class="primary"
                data-action="town"
            >
                ▶ Begin Adventure
            </button>

        </div>

    </div>
`);
</script>

</body>
</html>
