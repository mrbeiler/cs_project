<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady — Clothes Creator</title>
<style>
*{box-sizing:border-box}
:root{--bg:#e9d3a8;--ink:#3b2414;--panel:#f3e4c2;--line:#3b2414;--gold:#e8c24a}
@media (prefers-color-scheme:dark){:root{--bg:#2a1d14;--ink:#f0dcb4;--panel:#3a2a1d;--line:#c9a96a}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 8px;font-size:1.3rem;letter-spacing:.08em;text-align:center}
.wrap{display:grid;grid-template-columns:auto minmax(260px,1fr);gap:12px;max-width:980px;margin:0 auto;align-items:start}
@media(max-width:640px){.wrap{grid-template-columns:1fr}}
.box{background:var(--panel);border-radius:10px;padding:8px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.edwrap{position:relative;display:inline-block;border:2px solid var(--line);border-radius:6px;background:repeating-conic-gradient(#c9b78f 0 25%,#d9c9a4 0 50%) 0 0/16px 16px;line-height:0}
#ed{height:min(66dvh,560px);aspect-ratio:24/40;image-rendering:pixelated;cursor:crosshair;touch-action:none;display:block}
.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(0,0,0,.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.14) 1px,transparent 1px);background-size:calc(100%/24) 100%,100% calc(100%/40)}
.grid.off{display:none}
.edcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.prev{display:flex;gap:8px;align-items:flex-end}
.prev canvas{height:110px;aspect-ratio:24/40;image-rendering:pixelated;background:#d9c9a4;border-radius:4px}
.ttl{margin:8px 0 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.ttl:first-child{margin-top:0}
button,select{font:inherit;font-size:.85rem;cursor:pointer;border-radius:7px;border:2px solid var(--line);padding:5px 10px;background:var(--panel);color:var(--ink)}
button.on{background:var(--ink);color:var(--panel)}
button.gold{background:var(--gold);color:#3b2414;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.slot{display:flex;gap:4px;align-items:center;width:100%;margin-bottom:3px}
.slot .nm{flex:1;text-align:left}
.slot .eye{padding:5px 8px}
input[type=range]{flex:1;min-width:120px;accent-color:#c0392b}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(20px,1fr));gap:3px}
.pal i{aspect-ratio:1;border:1px solid rgba(0,0,0,.45);border-radius:3px;cursor:pointer}
.pal i.sel{outline:2px solid var(--ink);outline-offset:1px}
input[type=color]{width:42px;height:32px;padding:0;border:2px solid var(--line);border-radius:6px;background:none}
dialog{max-width:min(680px,92vw);background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px}
dialog textarea{width:100%;height:46vh;font:12px/1.35 monospace}
small{opacity:.8}
</style></head><body>
<h1>STEADY · CLOTHES CREATOR</h1>
<div class="wrap">
 <div class="box edcol">
  <div class="row"><button id="sF" class="on">Front</button><button id="sB">Back</button><button id="both" title="Paint on the front and back at the same time">Both sides</button><button id="mir" class="on" title="Mirror strokes left/right">Mirror</button><button id="mirFB" title="Mirror strokes front to back (paint mirrored X onto the opposite side)">F↔B</button><button id="gr" class="on">Grid</button><button id="mine" class="on" title="Show or hide your drawing on top of the base characters">My drawing</button></div>
  <div class="edwrap"><canvas id="ed" width="24" height="40"></canvas><div class="grid" id="gridEl"></div></div>
  <div class="prev"><canvas id="pvF" width="24" height="40"></canvas><canvas id="pvB" width="24" height="40"></canvas></div>
 </div>
 <div class="box">
  <p class="ttl">Garment layer</p><div id="slots"></div>
  <div class="row" style="margin-top:4px"><button id="cpy" title="Copy this garment's front pixels onto its back">Front → Back</button><small>Base:</small><select id="base"></select></div>
  <p class="ttl">Tool</p>
  <div class="row" id="tools"><button data-t="pencil" class="on">Pencil</button><button data-t="eraser">Eraser</button><button id="ea" class="on" title="Eraser removes pixels from every garment, not just the selected one">All layers</button><button data-t="cut" title="Cut a hole through the base outfit">Cut</button><button data-t="fill">Fill</button><button data-t="pick">Pick</button><button id="un">Undo</button><button id="re">Redo</button></div>
  <p class="ttl">Pen size <small id="szv">1 px</small></p>
  <div class="row"><input type="range" id="size" min="1" max="8" value="1"></div>
  <p class="ttl">Transparent <small id="trv">0%</small></p>
  <div class="row"><input type="range" id="tr" min="0" max="100" value="0" title="Makes this pen's own pixels see-through (0% = solid, 100% = invisible)"></div>
  <p class="ttl">Negative transparent (erase under) <small id="ntv">0%</small></p>
  <div class="row"><input type="range" id="nt" min="0" max="100" value="0" title="Makes pixels underneath (lower garments + base character) also transparent"></div>
  <p class="ttl">Piece colour — <span id="pcn"></span></p>
  <div class="row"><input type="color" id="col" value="#b8452f"><small>or pick a swatch</small></div>
  <p class="ttl">Light – dark <small id="ldv">100%</small></p>
  <div class="row"><input type="range" id="ld" min="0" max="200" value="100"></div>
  <div class="pal" id="pal" style="margin-top:6px"></div>
  <p class="ttl">Outfit</p>
  <div class="row"><button id="save" class="gold">Save JSON</button><button id="load">Load JSON</button><button id="png">PNG</button><button id="code" class="gold">Game code</button><button id="clr">Clear all</button><button id="wipe" title="Delete the autosaved drawing from this browser">Wipe saved</button></div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <p class="ttl"><small style="text-transform:none;letter-spacing:0">Work autosaves in this browser. “Game code” gives a snippet to paste into Steady.html.</small></p>
 </div>
</div>
<dialog id="dlg"><p class="ttl">Paste into Steady.html</p><textarea id="out" readonly></textarea><div class="row" style="margin-top:6px"><button id="cp" class="gold">Copy</button><button id="cl">Close</button></div></dialog>
<script>
const SKIN='#e0a57a', HAIR='#3a2a1e', EYE='#1d120a', MOUTH='#9a4a2c';
const SHIRTS={cream:'#eadbb9',red:'#b8452f',blue:'#4a7ab5',green:'#5a7d3a',black:'#3a3632',white:'#f6f1e6',purple:'#7a4a9a',orange:'#c97a2e',teal:'#3a8a8a',maroon:'#6e2a3a',brown:'#8a5a2b'};
const PANTS={blue:{b:'#3f62a0',d:'#2f4a7c'},dark:{b:'#2e3a52',d:'#1e283c'},brown:{b:'#6b4a2e',d:'#4a3220'},black:{b:'#2b2b2e',d:'#161617'},chaps:{b:'#3f62a0',d:'#2f4a7c',chap:'#a67c44'},grey:{b:'#6e6e72',d:'#4a4a4e'},olive:{b:'#5a5e3a',d:'#3c4028'},white:{b:'#e8e4da',d:'#b8b0a8'}};
const BOOTS={brown:{b:'#5a3220',s:'#2a170d'},black:{b:'#2a2320',s:'#0e0c0b'},oxblood:{b:'#6e2a22',s:'#2a0e0c'},tan:{b:'#9a6a3a',s:'#4a3018'},grey:{b:'#4a4a4e',s:'#222226'},red:{b:'#8a2a22',s:'#3a0e0c'},white:{b:'#d8d0c0',s:'#4a4433'},navy:{b:'#2e3a52',s:'#141422'}};
const BANDS={red:'#c0392b',blue:'#2f5a9a',black:'#232323',green:'#3a7a4a',gold:'#d8a93a',white:'#e8e4da',purple:'#6a3a8a',orange:'#c97a2e',teal:'#2e8a8a',brown:'#8a5a2b',none:null};
const VESTS={brown:{b:'#5a3a22',d:'#3f2616'},black:{b:'#2e2a28',d:'#161415'},tan:{b:'#a67c44',d:'#7a5a2e'},red:{b:'#8a2a22',d:'#5a1a16'},grey:{b:'#5a5a5e',d:'#3a3a3e'},white:{b:'#d8d0c0',d:'#a89a80'},none:null};
const HAT_COLORS={brown:'#8a5a2b',black:'#232326',white:'#d8d0c0',tan:'#c49a5a',grey:'#6e6e72',red:'#8a3a2a'};
const COAT_COLORS={tan:'#b89a6a',brown:'#6b4a2e',black:'#2e2a28',grey:'#5a5a5e',red:'#8a3a2e',navy:'#2e3a52',white:'#d8d0c0'};
function shade(hex,f){ const n=parseInt(hex.slice(1),16); const r=Math.max(0,Math.min(255,Math.round(((n>>16)&255)*f))), g=Math.max(0,Math.min(255,Math.round(((n>>8)&255)*f))), b=Math.max(0,Math.min(255,Math.round((n&255)*f))); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
const FOE_PRESETS=[
 {hatStyle:'outlaw',hatColor:'black',face:'scar',shirtStyle:'plain',shirt:'black',vestStyle:'standard',vestColor:'black',coatStyle:'none',coatColor:'tan',bandana:'black',bandanaStyle:'classic',pantsStyle:'plain',pantsColor:'black',bootsStyle:'plain',boots:'black'},
 {hatStyle:'sombrero',hatColor:'red',face:'mustache',shirtStyle:'plain',shirt:'white',vestStyle:'standard',vestColor:'red',coatStyle:'none',coatColor:'tan',bandana:'red',bandanaStyle:'mask',pantsStyle:'plain',pantsColor:'brown',bootsStyle:'spur',boots:'brown'},
 {hatStyle:'gambler',hatColor:'tan',face:'grizzled',shirtStyle:'plain',shirt:'cream',vestStyle:'none',vestColor:'brown',coatStyle:'duster',coatColor:'tan',bandana:'gold',bandanaStyle:'classic',pantsStyle:'plain',pantsColor:'blue',bootsStyle:'plain',boots:'brown'},
 {hatStyle:'tophat',hatColor:'black',face:'handlebar',shirtStyle:'striped',shirt:'purple',vestStyle:'none',vestColor:'black',coatStyle:'jacket',coatColor:'black',bandana:'black',bandanaStyle:'none',pantsStyle:'striped',pantsColor:'black',bootsStyle:'tooled',boots:'grey'},
 {hatStyle:'bowler',hatColor:'black',face:'mask',shirtStyle:'plain',shirt:'grey',vestStyle:'none',vestColor:'black',coatStyle:'overcoat',coatColor:'black',bandana:'black',bandanaStyle:'classic',pantsStyle:'plain',pantsColor:'dark',bootsStyle:'plain',boots:'black'},
 {hatStyle:'straw',hatColor:'tan',face:'beard',shirtStyle:'plaid',shirt:'red',vestStyle:'none',vestColor:'brown',coatStyle:'poncho',coatColor:'brown',bandana:'blue',bandanaStyle:'classic',pantsStyle:'chaps',pantsColor:'blue',bootsStyle:'spur',boots:'brown'}
];
function drawFigure(id,back,pose,outfit){
  pose=pose||{dy:0,gun:'holster',flash:0};
  outfit=outfit||state;
  const cv=document.getElementById(id), x=cv.getContext('2d');
  x.clearRect(0,0,24,40); x.save();
  if(pose.mirror){ x.translate(24,0); x.scale(-1,1); }
  x.translate(0,pose.dy||0);
  const r=(a,b,w,h,c)=>{if(c==null)return; x.fillStyle=c; x.fillRect(a,b,w,h);};
  const shirt=SHIRTS[outfit.shirt]||SHIRTS.cream;
  const pant=PANTS[outfit.pantsColor]||PANTS.blue;
  const boot=BOOTS[outfit.boots]||BOOTS.brown;
  const band=BANDS[outfit.bandana], bStyle=outfit.bandanaStyle;
  const vest=VESTS[outfit.vestColor];
  const coat=outfit.coatStyle, vestStyle=outfit.vestStyle, pantsStyle=outfit.pantsStyle;
  const face=outfit.face;
  const gunOut=(pose.gun==='draw'||pose.gun==='fire');
  const hx=pose.flipGun?5:17, drawP=(pose.drawP!=null)?pose.drawP:(gunOut?1:0);

  r(8,27,8,9,pant.b); x.clearRect(11,30,2,6); r(8,27,1,9,pant.d);
  if(pantsStyle==='chaps'){ r(8,27,2,9,'#a67c44'); r(14,27,2,9,'#a67c44'); r(8,27,1,9,'rgba(0,0,0,.2)'); r(15,27,1,9,'rgba(0,0,0,.2)'); }
  if(pantsStyle==='striped'){ r(8,27,1,9,'rgba(255,255,255,.4)'); r(15,27,1,9,'rgba(255,255,255,.4)'); }
  r(7,36,4,3,boot.b); r(13,36,4,3,boot.b);   r(7,39,4,1,boot.s); r(13,39,4,1,boot.s);
  if(outfit.bootsStyle==='tooled'){ r(7,36,4,1,'rgba(255,255,255,.5)'); r(13,36,4,1,'rgba(255,255,255,.5)'); r(7,38,4,1,shade(boot.b,0.55)); r(13,38,4,1,shade(boot.b,0.55)); }
  else if(outfit.bootsStyle==='spur'){ r(7,37,4,1,'#2a2a2a'); r(13,37,4,1,'#2a2a2a'); r(5,37,2,2,'#c0c0c0'); r(17,37,2,2,'#c0c0c0'); }
  if(back){ r(6,38,1,1,'#e8c24a'); r(17,38,1,1,'#e8c24a'); }
  else { r(6,37,1,2,boot.b); r(17,37,1,2,boot.b); }

  r(8,17,8,9,shirt);
  const shDark=shade(shirt,0.72), shLite='rgba(255,255,255,.35)';
  if(outfit.shirtStyle==='plaid'){ r(10,17,1,9,shDark); r(13,17,1,9,shDark); r(8,19,8,1,shDark); r(8,22,8,1,shDark); }
  else if(outfit.shirtStyle==='striped'){ r(10,17,1,9,shLite); r(13,17,1,9,shLite); }
  else if(outfit.shirtStyle==='yoke'){ r(8,17,8,2,shDark); r(10,19,1,1,'#e8c24a'); r(13,19,1,1,'#e8c24a'); }
  r(5,17,3,9,shirt); r(5,25,3,1,shDark); r(5,26,3,3,SKIN);
  if(drawP<=0){ r(16,17,3,9,shirt); r(16,25,3,1,shDark); r(16,26,3,3,SKIN); }
  else if(drawP>=1){
    const hy = pose.gun==='fire' ? 22 : 23;
    if(pose.flipGun){ r(4,17,4,4,shirt); r(3,20,3,3,shirt); r(2,hy,3,3,SKIN); }
    else { r(16,17,4,4,shirt); r(18,20,3,3,shirt); r(19,hy,3,3,SKIN); }
  }
  else if(drawP<0.75){ r(16,17,3,9,shirt); r(16,25,3,1,shDark); r(16,26,3,3,SKIN); r(hx,drawP<0.5?24:23,2,2,SKIN); }
  else { r(16,17,3,9,shirt); r(16,25,3,1,shDark); r(16,26,3,3,SKIN);
    if(pose.flipGun){ r(4,17,4,4,shirt); r(3,20,3,3,shirt); r(3,22,3,2,SKIN); }
    else { r(16,17,4,4,shirt); r(18,20,3,3,shirt); r(18,22,3,2,SKIN); } }

  if(coat==='none'){
    if(vestStyle!=='none'&&vest){
      if(back){
        r(8,17,8,9,vest.b); r(11,18,2,8,vest.d); r(8,17,8,1,vest.d);
        if(vestStyle==='open'){ r(11,18,2,8,shirt); }
        if(vestStyle==='fringe'){ r(7,19,1,1,'#e8c24a'); r(7,21,1,1,'#e8c24a'); r(7,23,1,1,'#e8c24a'); r(16,19,1,1,'#e8c24a'); r(16,21,1,1,'#e8c24a'); r(16,23,1,1,'#e8c24a'); }
      } else if(vestStyle==='open'){
        r(8,17,3,3,vest.b); r(13,17,3,3,vest.b);
        r(8,20,2,3,vest.b); r(14,20,2,3,vest.b);
        r(8,23,1,3,vest.b); r(15,23,1,3,vest.b);
      } else {
        r(8,17,3,9,vest.b); r(13,17,3,9,vest.b); r(9,19,2,2,'#e8c24a'); r(14,22,1,1,'#e8c24a');
        if(vestStyle==='fringe'){ r(7,19,1,1,'#e8c24a'); r(7,21,1,1,'#e8c24a'); r(7,23,1,1,'#e8c24a'); r(16,19,1,1,'#e8c24a'); r(16,21,1,1,'#e8c24a'); r(16,23,1,1,'#e8c24a'); }
      }
    }
  }
  const coatBase=COAT_COLORS[outfit.coatColor]||COAT_COLORS.tan, coatDark=shade(coatBase,0.7);
  if(coat==='duster'){
    const dc=coatBase, dd=coatDark;
    if(back){ r(7,17,10,18,dc); r(11,18,2,17,dd); r(7,17,10,1,dd); r(11,17,2,2,'#5a3a22'); }
    else { r(7,17,4,18,dc); r(13,17,4,18,dc); r(7,17,4,1,dd); r(13,17,4,1,dd); r(7,22,1,4,dd); r(16,22,1,4,dd); r(10,17,1,2,'#e8c24a'); }
    r(9,15,6,2,dd);
  } else if(coat==='overcoat'){
    // knee-length double-breasted coat: solid front, lapels, button column
    const dc=coatBase, dd=coatDark;
    if(back){ r(8,17,8,12,dc); r(11,18,2,11,dd); r(8,17,8,1,dd); }
    else { r(8,17,8,12,dc); r(9,17,2,3,dd); r(13,17,2,3,dd); r(11,20,1,1,'#e8c24a'); r(11,22,1,1,'#e8c24a'); r(11,24,1,1,'#e8c24a'); r(11,27,1,1,'#e8c24a'); }
    r(8,15,8,2,dd);
    r(5,17,3,9,dc); r(16,17,3,9,dc);
    if(gunOut){ const hy=pose.gun==='fire'?22:23; if(pose.flipGun){ r(3,20,3,3,dc); r(2,hy,3,3,SKIN); } else { r(18,20,3,3,dc); r(19,hy,3,3,SKIN); } }
    else { r(5,26,3,3,SKIN); r(16,26,3,3,SKIN); }
  } else if(coat==='poncho'){
    const pc=coatBase, pd=coatDark, st='#e8c24a';
    r(4,17,16,10,pc); r(4,17,16,1,pd); r(4,24,16,1,st); r(4,22,16,1,'#eadbb9');
    if(back){ r(10,18,4,6,pd); } else { r(11,18,2,5,pd); }
    if(!back){ r(9,19,1,1,st); r(14,21,1,1,st); }
  } else if(coat==='jacket'){
    const jc=coatBase, jd=coatDark;
    if(back){ r(8,17,8,9,jc); r(11,18,2,8,jd); r(8,17,8,1,jd); }
    else { r(8,17,8,9,jc); r(11,17,2,9,shirt); r(9,17,2,2,jd); r(13,17,2,2,jd); r(9,20,1,1,'#e8c24a'); }
    r(5,17,3,9,jc); if(!(pose.flipGun&&gunOut)) r(16,17,3,9,jc);
    if(gunOut){ const hy=pose.gun==='fire'?22:23; if(pose.flipGun){ r(3,20,3,3,jc); r(2,hy,3,3,SKIN); } else { r(18,20,3,3,jc); r(19,hy,3,3,SKIN); } }
    else { r(5,26,3,3,SKIN); r(16,26,3,3,SKIN); }
  } else if(coat==='cape'){
    const cc=coatBase, cd=coatDark;
    r(4,17,16,6,cc); r(4,17,16,1,cd);
    r(9,15,6,2,cd);
    if(back){ r(11,18,2,3,cd); } else { r(11,19,1,1,'#e8c24a'); }
  }

  r(8,26,8,1,'#2a1a10'); if(!back) r(11,26,2,1,'#e8c24a');
  // holster sits on the gun side so nothing gun-like dangles off-side
  if(drawP<1){ r(hx,24,2,5,'#4a2e1a'); r(hx,24,2,1,'#222'); if(!back) r(hx,24,1,1,'#666'); }
  else { r(hx,24,2,5,'#4a2e1a'); r(hx,28,2,1,'#2a1a10'); }

  r(10,15,4,1,SKIN); r(7,11,1,2,SKIN); r(16,11,1,2,SKIN);
  if(back){
    r(8,9,8,6,HAIR); r(7,11,1,2,HAIR); r(16,11,1,2,HAIR); r(10,15,4,1,SKIN);
  } else {
    r(8,9,8,6,SKIN); r(10,11,1,1,EYE); r(13,11,1,1,EYE); r(11,13,2,1,MOUTH);
    r(8,9,8,1,'rgba(60,30,10,.35)');
    if(face==='mustache'){ r(10,12,4,1,'#2a1a10'); r(9,12,1,1,'#2a1a10'); r(14,12,1,1,'#2a1a10'); }
    if(face==='beard'){ r(8,12,8,3,HAIR); r(11,13,2,1,MOUTH); }
    if(face==='scar'){ r(13,10,1,3,'#a33a2a'); r(9,12,3,1,'rgba(60,30,10,.4)'); r(10,11,1,1,'#fff'); }
    if(face==='grizzled'){ r(9,12,6,2,'#b8b0a4'); r(10,14,4,1,'#b8b0a4'); r(10,12,4,1,'#ddd6c8'); r(11,13,2,1,MOUTH); }
    if(face==='mask'){ r(8,10,8,2,'#1a1a1e'); r(10,11,1,1,'#fff'); r(13,11,1,1,'#fff'); r(11,13,2,1,MOUTH); }
    if(face==='handlebar'){ r(8,12,8,1,'#2a1a10'); r(7,11,1,2,'#2a1a10'); r(16,11,1,2,'#2a1a10'); }
    if(face==='eyepatch'){ r(13,10,2,2,'#15151a'); r(13,10,2,1,'#33333c'); r(9,10,2,1,'#15151a'); r(11,9,5,1,'#15151a'); r(8,11,1,1,'#15151a'); }
  }
  if(bStyle!=='none'&&band){
    if(back){
      if(bStyle==='headband'){ r(8,9,8,1,band); r(6,11,1,3,band); }
      else { r(8,15,8,2,band); r(11,17,2,2,band); r(10,19,1,1,band); r(13,19,1,1,band); }
    }
    else {
      if(bStyle==='mask'){ r(8,12,8,3,band); r(8,15,8,2,band); r(11,17,2,1,band); }
